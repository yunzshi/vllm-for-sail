# ==============================================================================
# Fork CI - Compile Tests
# ==============================================================================
# Test areas: compile
# Source: .buildkite/test_areas/compile.yaml
# ==============================================================================

name: "Fork CI - Compile"

on:
  workflow_call:

jobs:
  seq-parallel-2gpu:
    name: "Sequence Parallel Correctness (2 GPUs)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 50
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        run: |
          export VLLM_TEST_CLEAN_GPU_MEMORY=1
          pytest -v -s tests/compile/correctness_e2e/test_sequence_parallel.py

  seq-parallel-2xh100:
    if: false  # Requires H100
    name: "Sequence Parallel Correctness (2xH100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
