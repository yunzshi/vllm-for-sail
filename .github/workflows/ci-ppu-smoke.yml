# ============================================================================
# CI PPU Smoke
# ============================================================================
# 覆盖场景：checkout → 编译 → 制品上传 → docker build → 测试
#
# Job 依赖图：
#   build (ubuntu-latest)  ──→  test-on-ppu (self-hosted, PPU)
#     └─ 编译 + upload-artifact     └─ docker build + run tests
# ============================================================================

name: CI PPU Smoke

on:
  push:
    branches: [test/ppu-smoke-ci]
  workflow_dispatch:

concurrency:
  group: ci-ppu-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job 1: 编译 + 制品上传
  #   runs-on: ubuntu-latest (GitHub-hosted)
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p dist
          echo "version=$(git describe --tags --always)" > dist/build-info.txt
          echo "sha=${{ github.sha }}" >> dist/build-info.txt
          echo "ref=${{ github.ref_name }}" >> dist/build-info.txt
          echo "time=$(date -u +%FT%TZ)" >> dist/build-info.txt
          cat dist/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_id }}
          path: dist/
          retention-days: 3

  # ==========================================================================
  # Job 2: Docker build + 测试
  #   runs-on: [self-hosted, Linux, X64, ppu] (PPU 自托管 runner)
  #   参考 fork-ci-cpu-build.yml：load: true + docker run
  # ==========================================================================
  test-on-ppu:
    name: Test on PPU
    runs-on: [self-hosted, Linux, X64, ppu]
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.run_id }}
          path: dist/

      - name: Show build info
        run: cat dist/build-info.txt

      - name: Build Docker image
        run: |
          docker buildx build \
            --file docker/Dockerfile.cpu \
            --target base \
            --build-arg max_jobs=4 \
            --tag vllm-ppu-smoke:${{ github.sha }} \
            --load \
            .

      - name: PPU hardware check
        run: ppu-smi

      - name: Run smoke test
        run: |
          docker run --rm vllm-ppu-smoke:${{ github.sha }} \
            python3 -c "import sys; print(f'Python {sys.version}')"
