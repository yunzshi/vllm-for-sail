# ============================================================================
# CI PPU Smoke
# ============================================================================
# 覆盖场景：checkout → docker build & push to GHCR → test on PPU runner
#
# Job 依赖图：
#   build (ubuntu-latest)  ──→  test-on-ppu (self-hosted, PPU)
#     └─ docker build & push       └─ docker pull & run tests
#
# PPU runner 通过代理访问 ghcr.io 拉取镜像。
# ============================================================================

name: CI PPU Smoke

on:
  push:
    branches: [test/ppu-smoke-ci]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-ppu-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ppu-smoke

jobs:
  # ==========================================================================
  # Job 1: Build & Push Docker image to GHCR
  #   runs-on: ubuntu-latest (GitHub-hosted, 可访问 Docker Hub)
  # ==========================================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          target: base
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            max_jobs=4

  # ==========================================================================
  # Job 2: Pull image & run tests on PPU self-hosted runner
  #   runs-on: [self-hosted, Linux, X64, ppu]
  #   PPU runner 通过 HTTP 代理访问 ghcr.io
  # ==========================================================================
  test-on-ppu:
    name: Test on PPU
    runs-on: [self-hosted, Linux, X64, ppu]
    needs: build
    timeout-minutes: 15
    env:
      HTTP_PROXY: http://172.26.46.100:3128
      HTTPS_PROXY: http://172.26.46.100:3128
      NO_PROXY: localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ needs.build.outputs.image }}

      - name: PPU hardware check
        run: ppu-smi

      - name: Run smoke test
        run: |
          docker run --rm ${{ needs.build.outputs.image }} \
            python3 -c "import sys; print(f'Python {sys.version}')"
