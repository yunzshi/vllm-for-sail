# ==============================================================================
# Fork CI - Distributed Tests
# ==============================================================================
# Test areas: distributed, expert_parallelism
# Source: .buildkite/test_areas/{distributed,expert_parallelism}.yaml
# ==============================================================================

name: "Fork CI - Distributed"

on:
  workflow_call:

jobs:
  # --- Distributed ---
  dist-comm-ops:
    name: "Distributed Comm Ops (2 GPUs)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 20
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pytest -v -s distributed/test_comm_ops.py
          pytest -v -s distributed/test_shm_broadcast.py
          pytest -v -s distributed/test_shm_buffer.py
          pytest -v -s distributed/test_shm_storage.py

  dist-2gpu:
    name: "Distributed (2 GPUs)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          export NCCL_CUMEM_HOST_ENABLE=0
          TP_SIZE=1 DP_SIZE=2 pytest -v -s v1/distributed/test_async_llm_dp.py
          TP_SIZE=1 DP_SIZE=2 pytest -v -s v1/distributed/test_eagle_dp.py
          TP_SIZE=1 DP_SIZE=2 pytest -v -s v1/distributed/test_external_lb_dp.py
          DP_SIZE=2 pytest -v -s v1/entrypoints/openai/test_multi_api_servers.py
          pytest -v -s entrypoints/llm/test_collective_rpc.py
          pytest -v -s ./compile/fullgraph/test_basic_correctness.py
          pytest -v -s ./compile/test_wrapper.py
          VLLM_TEST_SAME_HOST=1 torchrun --nproc-per-node=4 distributed/test_same_node.py | grep 'Same node test passed'
          VLLM_TEST_SAME_HOST=1 VLLM_TEST_WITH_DEFAULT_DEVICE_SET=1 torchrun --nproc-per-node=4 distributed/test_same_node.py | grep 'Same node test passed'
          CUDA_VISIBLE_DEVICES=0,1 pytest -v -s v1/shutdown
          pytest -v -s v1/worker/test_worker_memory_snapshot.py

  dist-4gpu:
