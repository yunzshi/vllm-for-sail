# ==============================================================================
# Fork CI - Core Tests
# ==============================================================================
# Test areas: attention, basic_correctness, cuda, engine, model_executor
# Source: .buildkite/test_areas/{attention,basic_correctness,cuda,engine,model_executor}.yaml
#
# NOTE: attention tests require H100/B200 only, skipped for A100.
# ==============================================================================

name: "Fork CI - Core"

on:
  workflow_call:

jobs:
  # --- CUDA ---
  cuda-platform:
    name: "Platform Tests (CUDA)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 15
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pytest -v -s cuda/test_cuda_context.py
          pytest -v -s cuda/test_platform_no_cuda_init.py

  cudagraph:
    name: "Cudagraph"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 20
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pytest -v -s v1/cudagraph/test_cudagraph_dispatch.py
          pytest -v -s v1/cudagraph/test_cudagraph_mode.py

  # --- Engine ---
  engine:
    name: "Engine"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 15
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -v -s engine test_sequence.py test_config.py test_logger.py test_vllm_port.py

  v1-engine-1gpu:
    name: "V1 E2E + Engine (1 GPU)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 45
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pytest -v -s v1/e2e
          pytest -v -s v1/engine/test_preprocess_error_handling.py
          pytest -v -s v1/engine --ignore v1/engine/test_preprocess_error_handling.py

  v1-e2e-2gpu:
    name: "V1 E2E (2 GPUs)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -v -s v1/e2e/test_spec_decode.py -k "tensor_parallelism"

  v1-e2e-4gpu:
    name: "V1 E2E (4 GPUs)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -v -s v1/e2e/test_spec_decode.py -k "eagle_correctness_heavy"

  # --- Basic Correctness ---
  basic-correctness:
    name: "Basic Correctness"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 30
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          export VLLM_WORKER_MULTIPROC_METHOD=spawn
          pytest -v -s basic_correctness/test_cumem.py
          pytest -v -s basic_correctness/test_basic_correctness.py
          pytest -v -s basic_correctness/test_cpu_offload.py

  # --- Model Executor ---
  model-executor:
    name: "Model Executor"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 35
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          apt-get update && apt-get install -y curl libsodium23
          export VLLM_WORKER_MULTIPROC_METHOD=spawn
          pytest -v -s model_executor
          pytest -v -s entrypoints/openai/test_tensorizer_entrypoint.py
