# ==============================================================================
# Fork CI - Entry Workflow
# ==============================================================================
# Main entry point for running vLLM CI tests on fork repositories.
# Uses self-hosted runners with Docker-based test execution.
#
# Architecture:
#   1. detect-changes job: runs detect-changes.sh to determine affected groups
#   2. build-image job: builds test-ci Docker image with compiled vllm._C
#   3. Conditionally calls 8 sub-workflows using the pre-built image
#
# Sub-workflows:
#   fork-ci-core.yml         → attention, basic_correctness, cuda, engine, model_executor
#   fork-ci-kernels.yml      → kernels
#   fork-ci-compile.yml      → compile
#   fork-ci-distributed.yml  → distributed, expert_parallelism
#   fork-ci-entrypoints.yml  → entrypoints
#   fork-ci-models.yml       → models_language, models_multimodal, models_basic, models_distributed
#   fork-ci-functional.yml   → lora, quantization, samplers, pytorch, plugins, ray_compat, weight_loading
#   fork-ci-misc.yml         → misc, benchmarks, lm_eval, e2e_integration
# ==============================================================================

name: Fork CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Force run all test groups'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Detect which test groups need to run
  # ============================================================================
  detect-changes:
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
    outputs:
      run_core: ${{ steps.detect.outputs.run_core }}
      run_kernels: ${{ steps.detect.outputs.run_kernels }}
      run_compile: ${{ steps.detect.outputs.run_compile }}
      run_distributed: ${{ steps.detect.outputs.run_distributed }}
      run_entrypoints: ${{ steps.detect.outputs.run_entrypoints }}
      run_models: ${{ steps.detect.outputs.run_models }}
      run_functional: ${{ steps.detect.outputs.run_functional }}
      run_misc: ${{ steps.detect.outputs.run_misc }}
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Fetch base branch for diff comparison
          git fetch origin "+refs/heads/${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}"
          # Fetch and checkout current PR/branch
          git fetch origin "${GITHUB_REF}"
          git checkout FETCH_HEAD

      - name: Detect changes
        id: detect
        run: |
          if [ "${{ github.event.inputs.run_all }}" = "true" ]; then
            echo "::notice::Force run_all via workflow_dispatch"
            for group in core kernels compile distributed entrypoints models functional misc; do
              echo "run_${group}=true" >> "$GITHUB_OUTPUT"
            done
          else
            bash .github/scripts/detect-changes.sh origin/${{ github.base_ref || 'main' }}
          fi

  # ============================================================================
  # Stage 2: Build test-ci Docker image with compiled vllm._C
  # ============================================================================
  build-image:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.run_core == 'true' ||
      needs.detect-changes.outputs.run_kernels == 'true' ||
      needs.detect-changes.outputs.run_compile == 'true' ||
      needs.detect-changes.outputs.run_distributed == 'true' ||
      needs.detect-changes.outputs.run_entrypoints == 'true' ||
      needs.detect-changes.outputs.run_models == 'true' ||
      needs.detect-changes.outputs.run_functional == 'true' ||
      needs.detect-changes.outputs.run_misc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Free disk space
        run: |
          # GitHub runners have ~14GB free; vLLM image build needs much more
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test-ci image
        id: build
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:test-ci-${GITHUB_SHA:0:12}"
          # Skip if image already exists on GHCR
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image exists on GHCR, skipping build"
          else
            CUDA_VER="12.9.1"
            # Build on GitHub-hosted runner: pypi.org is fast, no mirror/sed hacks needed
            docker buildx build \
              --target test \
              --build-arg max_jobs=4 \
              --build-arg nvcc_threads=2 \
              --build-arg torch_cuda_arch_list="8.0" \
              --build-arg SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0+ci" \
              --build-arg BUILD_BASE_IMAGE="nvcr.io/nvidia/cuda:${CUDA_VER}-devel-ubuntu20.04" \
              --build-arg FINAL_BASE_IMAGE="nvcr.io/nvidia/cuda:${CUDA_VER}-base-ubuntu22.04" \
              --build-arg DEEPGEMM_GIT_REF="" \
              --build-arg DEEPEP_COMMIT_HASH="" \
              --build-arg RUN_WHEEL_CHECK=false \
              --build-arg INSTALL_FLASHINFER=false \
              --push \
              -t "$IMAGE" \
              -f docker/Dockerfile .
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

    # --- Commented out: self-hosted build with Aliyun mirror (for reference) ---
    # runs-on: [self-hosted, Linux, X64, A100]
    # timeout-minutes: 240
    # Build steps when using self-hosted runner with China network:
    #   PIP_MIRROR="https://mirrors.aliyun.com/pypi/simple/"
    #   sed -i 's|uv pip install|uv pip install --extra-index-url https://pypi.org/simple/ --retries 5|g' docker/Dockerfile
    #   --build-arg PIP_INDEX_URL="${PIP_MIRROR}"
    #   --build-arg PIP_EXTRA_INDEX_URL="https://pypi.org/simple/"
    #   --build-arg UV_INDEX_URL="${PIP_MIRROR}"
    #   --build-arg UV_EXTRA_INDEX_URL="https://pypi.org/simple/"
    #   --build-arg PIP_TRUSTED_HOST=mirrors.aliyun.com

  # ============================================================================
  # Stage 3: Conditionally run sub-workflows with pre-built image
  # ============================================================================
  core:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_core == 'true'
    uses: ./.github/workflows/fork-ci-core.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit

  kernels:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_kernels == 'true'
    uses: ./.github/workflows/fork-ci-kernels.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit

  compile:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_compile == 'true'
    uses: ./.github/workflows/fork-ci-compile.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit

  distributed:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_distributed == 'true'
    uses: ./.github/workflows/fork-ci-distributed.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit

  entrypoints:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_entrypoints == 'true'
    uses: ./.github/workflows/fork-ci-entrypoints.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit

  models:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_models == 'true'
    uses: ./.github/workflows/fork-ci-models.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit

  functional:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_functional == 'true'
    uses: ./.github/workflows/fork-ci-functional.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit

  misc:
    needs: [detect-changes, build-image]
    if: needs.detect-changes.outputs.run_misc == 'true'
    uses: ./.github/workflows/fork-ci-misc.yml
    with:
      docker_image: ${{ needs.build-image.outputs.image }}
    secrets: inherit
