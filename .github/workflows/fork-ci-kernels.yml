name: "Fork CI - Kernels"

on:
  workflow_call:

jobs:
  kernels-core:
    name: "Kernels Core Operation"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 75
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -v -s kernels/core kernels/test_top_k_per_row.py

  kernels-attention:
    name: "Kernels Attention (${{ matrix.shard }})"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 35
    strategy:
      matrix:
        shard: [0, 1]
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -v -s kernels/attention --shard-id=${{ matrix.shard }} --num-shards=2

  kernels-quantization:
    name: "Kernels Quantization (${{ matrix.shard }})"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
