          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pytest -v -s kernels/moe --ignore=kernels/moe/test_modular_oai_triton_moe.py --shard-id=${{ matrix.shard }} --num-shards=2
          pytest -v -s kernels/moe/test_modular_oai_triton_moe.py --shard-id=${{ matrix.shard }} --num-shards=2

