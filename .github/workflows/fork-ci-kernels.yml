          git checkout --force FETCH_HEAD
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -v -s kernels/quantization --shard-id=${{ matrix.shard }} --num-shards=2

  kernels-moe:
