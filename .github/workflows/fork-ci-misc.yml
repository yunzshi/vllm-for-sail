# ==============================================================================
# Fork CI - Misc Tests
# ==============================================================================
# Test areas: misc, benchmarks, lm_eval, e2e_integration
# Source: .buildkite/test_areas/{misc,benchmarks,lm_eval,e2e_integration}.yaml
# ==============================================================================

name: "Fork CI - Misc"

on:
  workflow_call:

jobs:
  # --- Misc ---
  v1-others:
    name: "V1 Others"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          uv pip install --system -r /vllm-workspace/requirements/kv_connectors.txt || pip install -r ../requirements/kv_connectors.txt || true
          export VLLM_WORKER_MULTIPROC_METHOD=spawn
          pytest -v -s -m 'not cpu_test' v1/core
          pytest -v -s v1/executor
          pytest -v -s v1/kv_offload
          pytest -v -s v1/sample
          pytest -v -s v1/logits_processors
          pytest -v -s v1/worker
          pytest -v -s -m 'not slow_test' v1/spec_decode
          pytest -v -s -m 'not cpu_test' v1/kv_connector/unit
          pytest -v -s -m 'not cpu_test' v1/metrics
          pytest -v -s v1/test_oracle.py
          pytest -v -s v1/test_request.py
          pytest -v -s v1/test_outputs.py
          pip install -U git+https://github.com/robertgshaw2-redhat/lm-evaluation-harness.git@streaming-api
          pytest -v -s entrypoints/openai/correctness/test_lmeval.py::test_lm_eval_accuracy_v1_engine

  v1-others-cpu:
    name: "V1 Others (CPU)"
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --shm-size=10g
    timeout-minutes: 30
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pytest -v -s -m 'cpu_test' v1/core
          pytest -v -s v1/structured_output
          pytest -v -s v1/test_serial_utils.py
          pytest -v -s -m 'cpu_test' v1/kv_connector/unit
          pytest -v -s -m 'cpu_test' v1/metrics

  regression:
    name: "Regression"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 20
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pip install modelscope
          pytest -v -s test_regression.py

  examples:
    name: "Examples"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 45
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: examples
        run: |
          pip install tensorizer
          python3 offline_inference/basic/chat.py
          python3 offline_inference/basic/generate.py --model facebook/opt-125m
          python3 offline_inference/basic/generate.py --model meta-llama/Llama-2-13b-chat-hf --cpu-offload-gb 10
          python3 offline_inference/basic/classify.py
          python3 offline_inference/basic/embed.py
          python3 offline_inference/basic/score.py
          python3 offline_inference/audio_language.py --seed 0
          python3 offline_inference/vision_language.py --seed 0
          python3 offline_inference/vision_language_multi_image.py --seed 0
          python3 offline_inference/encoder_decoder_multimodal.py --model-type whisper --seed 0
          python3 pooling/embed/vision_embedding_offline.py --seed 0
          python3 offline_inference/prefix_caching.py
          python3 offline_inference/llm_engine_example.py
          python3 others/tensorize_vllm_model.py --model facebook/opt-125m serialize --serialized-directory /tmp/ --suffix v1 && python3 others/tensorize_vllm_model.py --model facebook/opt-125m deserialize --path-to-tensors /tmp/vllm/facebook/opt-125m/v1/model.tensors
          python3 offline_inference/spec_decode.py --test --method eagle --num_spec_tokens 3 --dataset-name hf --dataset-path philschmid/mt-bench --num-prompts 80 --temp 0 --top-p 1.0 --top-k -1 --tp 1 --enable-chunked-prefill --max-model-len 2048
          python3 offline_inference/spec_decode.py --test --method eagle3 --num_spec_tokens 3 --dataset-name hf --dataset-path philschmid/mt-bench --num-prompts 80 --temp 0 --top-p 1.0 --top-k -1 --tp 1 --enable-chunked-prefill --max-model-len 1536

  metrics-tracing:
    name: "Metrics, Tracing (2 GPUs)"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 20
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pip install \
            'opentelemetry-sdk>=1.26.0' \
            'opentelemetry-api>=1.26.0' \
            'opentelemetry-exporter-otlp>=1.26.0' \
            'opentelemetry-semantic-conventions-ai>=0.4.1'
          pytest -v -s v1/tracing

  python-only-install:
    name: "Python-only Installation"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 20
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: bash standalone_tests/python_only_compile.sh

  async-engine-utils:
    name: "Async Engine, Inputs, Utils, Worker"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 50
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          pytest -v -s detokenizer
          pytest -v -s -m 'not cpu_test' multimodal
          pytest -v -s utils_

  async-engine-utils-cpu:
    name: "Async Engine, Inputs, Utils, Config (CPU)"
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --shm-size=10g
    timeout-minutes: 30
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          python3 standalone_tests/lazy_imports.py
          pytest -v -s test_inputs.py
          pytest -v -s test_outputs.py
          pytest -v -s test_pooling_params.py
          pytest -v -s test_ray_env.py
          pytest -v -s -m 'cpu_test' multimodal
          pytest -v -s renderers
          pytest -v -s tokenizers_
          pytest -v -s tool_parsers
          pytest -v -s transformers_utils
          pytest -v -s config

  batch-invariance-h100:
    if: false  # Requires H100
    name: "Batch Invariance (H100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 25
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          export VLLM_WORKER_MULTIPROC_METHOD=spawn
          pip install pytest-timeout pytest-forked
          pytest -v -s v1/determinism/test_batch_invariance.py
          pytest -v -s v1/determinism/test_rms_norm_batch_invariant.py

  acceptance-length-h100:
    if: false  # Requires H100
    name: "Acceptance Length Test (H100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 25
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          export VLLM_ALLOW_INSECURE_SERIALIZATION=1
          pytest -v -s v1/spec_decode/test_acceptance_length.py -m slow_test

  # --- Benchmarks ---
  benchmarks-cli:
    name: "Benchmarks CLI Test"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 20
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -v -s benchmarks/

  benchmarks-attention-b200:
    if: false  # Requires B200
    name: "Attention Benchmarks Smoke (B200)"
    runs-on: [self-hosted, Linux, X64, B200]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 10
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        run: python3 benchmarks/attention_benchmarks/benchmark.py --backends flash flashinfer --batch-specs "8q1s1k" --repeats 1 --warmup-iters 1

  # --- LM Eval ---
  lm-eval-small:
    name: "LM Eval Small Models"
    runs-on: [self-hosted, Linux, X64, A100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 75
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-small.txt

  lm-eval-large-h100:
    if: false  # Requires H100
    name: "LM Eval Large Models (4xH100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: .buildkite/lm-eval-harness
        run: |
          export VLLM_USE_DEEP_GEMM=0
          pytest -s -v test_lm_eval_correctness.py --config-list-file=configs/models-large-hopper.txt --tp-size=4

  lm-eval-small-b200:
    if: false  # Requires B200
    name: "LM Eval Small Models (B200)"
    runs-on: [self-hosted, Linux, X64, B200]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 120
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-blackwell.txt

  gpqa-eval-h100:
    if: false  # Requires H100
    name: "GPQA Eval (GPT-OSS) (2xH100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 120
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          uv pip install --system 'gpt-oss[eval]==0.0.5'
          pytest -s -v evals/gpt_oss/test_gpqa_correctness.py --config-list-file=configs/models-h100.txt

  gpqa-eval-b200:
    if: false  # Requires B200
    name: "GPQA Eval (GPT-OSS) (2xB200)"
    runs-on: [self-hosted, Linux, X64, B200]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 120
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        working-directory: tests
        run: |
          uv pip install --system 'gpt-oss[eval]==0.0.5'
          pytest -s -v evals/gpt_oss/test_gpqa_correctness.py --config-list-file=configs/models-b200.txt

  # --- E2E Integration ---
  e2e-deepseek-v2-lite-h100:
    if: false  # Requires H100
    name: "DeepSeek V2-Lite Accuracy (4xH100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        run: bash .buildkite/scripts/scheduled_integration_test/deepseek_v2_lite_ep_eplb.sh 0.25 200 8010

  e2e-qwen30b-h100:
    if: false  # Requires H100
    name: "Qwen3-30B-A3B Accuracy (4xH100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        run: bash .buildkite/scripts/scheduled_integration_test/qwen30b_a3b_fp8_block_ep_eplb.sh 0.8 200 8020

  e2e-qwen30b-b200:
    if: false  # Requires B200
    name: "Qwen3-30B-A3B Accuracy (2xB200)"
    runs-on: [self-hosted, Linux, X64, B200]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        run: bash .buildkite/scripts/scheduled_integration_test/qwen30b_a3b_fp8_block_ep_eplb.sh 0.8 200 8020 2 1

  e2e-deepseek-prefetch-h100:
    if: false  # Requires H100
    name: "DeepSeek V2-Lite Prefetch Offload (H100)"
    runs-on: [self-hosted, Linux, X64, H100]
    container:
      image: ${{ vars.VLLM_DOCKER_IMAGE }}
      options: --gpus all --shm-size=10g
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

      - name: Install git
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          PIP_CONSTRAINT="" pip install -r requirements/dev.txt
          pip install -e tests/vllm_test_utils
      - name: Run tests
        run: bash .buildkite/scripts/scheduled_integration_test/deepseek_v2_lite_prefetch_offload.sh 0.25 200 8030
